version: 2.6.0
pr_number: 194
is_breaking: true
schema_data_changes:
  entries:
  - models:
    - '[fivetran_platform__sync_metrics](https://fivetran.github.io/dbt_fivetran_log/#!/model/model.fivetran_log.fivetran_platform__sync_metrics)'
    change_type: New model
    notes: Returns one record per completed sync with its start and end times, status
      and reason, sync type, duration, volume, queries, rows extracted, and rows loaded,
      plus connection and destination details. `total_loaded_rows` counts insert,
      update, and delete operations, not distinct rows. Extract, process, and load
      time and process volume are null when a sync has no `sync_stats` event or the
      event doesn't include that value. Total duration and load volume come from other
      events, so they can still be populated. Extract volume, queries, and row counts
      are null when a sync skips every table.
  - models:
    - '[fivetran_platform__audit_trail_enriched](https://fivetran.github.io/dbt_fivetran_log/#!/model/model.fivetran_log.fivetran_platform__audit_trail_enriched)'
    change_type: New model
    notes: Enriches each audit trail event with the names of the primary and secondary
      resources involved (resolved for `CONNECTION`, `DESTINATION`, `ACCOUNT`, and
      `USER` resources) and the details of the user who performed the action. Only
      available for customers on the Enterprise plan and above, and disabled by default.
      Set the `fivetran_platform_using_audit_trail` variable to `true` to enable it.
  - models:
    - '[fivetran_platform__transformation_run_log](https://fivetran.github.io/dbt_fivetran_log/#!/model/model.fivetran_log.fivetran_platform__transformation_run_log)'
    change_type: New model
    notes: Surfaces transformation run events from the Fivetran log, including run
      timestamps, duration in HH:MM:SS format, per-step model success and failure
      counts, and overall run status. Requires the `transformation_runs` source table,
      and is disabled by default. Set the `fivetran_platform_using_transformations`
      variable to `true` to enable it.
  - models:
    - '[fivetran_platform__connection_errors_and_warnings](https://fivetran.github.io/dbt_fivetran_log/#!/model/model.fivetran_log.fivetran_platform__connection_errors_and_warnings)'
    change_type: New model
    notes: Unions error and warning events from the `log` (standard connections) and
      `connector_sdk_log` (Connector SDK connections) tables, enriched with `connection_name`.
  - models:
    - '[stg_fivetran_platform__audit_trail](https://fivetran.github.io/dbt_fivetran_log/#!/model/model.fivetran_log.stg_fivetran_platform__audit_trail)'
    change_type: New staging model
    notes: Records user actions performed within your Fivetran account (what was changed,
      by whom, and how). Only available for customers on the Enterprise plan and above,
      and disabled by default. Set the `fivetran_platform_using_audit_trail` variable
      to `true` to enable it.
  - models:
    - '[stg_fivetran_platform__connector_sdk_log](https://fivetran.github.io/dbt_fivetran_log/#!/model/model.fivetran_log.stg_fivetran_platform__connector_sdk_log)'
    change_type: New staging model
    notes: Staging model for the new `connector_sdk_log` source table.
  - models:
    - '[stg_fivetran_platform__log](https://fivetran.github.io/dbt_fivetran_log/#!/model/model.fivetran_log.stg_fivetran_platform__log)'
    change_type: Materialization
    old: view
    new: table (only when `fivetran_platform_log_start_date` is set)
    notes: Materializes as a table when the `fivetran_platform_log_start_date` variable
      is set. Date filter applies after column transformations, reducing source scan
      costs on downstream models for large log tables. Remains a view when the variable
      is unset.
  - models:
    - '[fivetran_platform__audit_table](https://fivetran.github.io/dbt_fivetran_log/#!/model/model.fivetran_log.fivetran_platform__audit_table)'
    change_type: New fields
    new: '`rows_extracted`<br>`rows_loaded`'
    notes: Adds `rows_extracted`, the rows extracted from the source for the table
      during the sync, and `rows_loaded`, the insert, update, and delete operations
      on the table during the sync. `rows_loaded` counts operations, not distinct
      rows.
  - models:
    - '[fivetran_platform__audit_table](https://fivetran.github.io/dbt_fivetran_log/#!/model/model.fivetran_log.fivetran_platform__audit_table)'
    change_type: Changed model
    notes: Tracks same-named tables in different schemas separately. Before, their
      write events could mix, so a record could show another schema's write times
      and row counts. Existing records for these tables may change.
new_features:
- Adds the `fivetran_platform_using_connector_sdk_log` variable (default `false`)
  to enable or disable the `connector_sdk_log` source and its downstream logic. Set
  this to `true` to enable the `connector_sdk_log` table. See the [README](https://github.com/fivetran/dbt_fivetran_log/blob/main/README.md#disable-models-for-non-existent-sources)
  for details.
- Adds the `fivetran_platform_using_audit_trail` variable (default `false`) to enable
  or disable the `audit_trail` source and its downstream logic. Set this to `true`
  to enable the `audit_trail` table. The `audit_trail` table is only available on
  the Enterprise plan and above. See the [README](https://github.com/fivetran/dbt_fivetran_log/blob/main/README.md#disable-models-for-non-existent-sources)
  for details.
- Adds the optional `fivetran_platform_log_start_date` variable to control how much
  source log data is scanned/loaded. When set to a date (`YYYY-MM-DD`), [`stg_fivetran_platform__log`](https://fivetran.github.io/dbt_fivetran_log/#!/model/model.fivetran_log.stg_fivetran_platform__log)
  filters to log records on or after that date. As downstream incremental models grow,
  you can periodically move the start date forward to keep full-refresh scans manageable.
  See the [README](https://github.com/fivetran/dbt_fivetran_log/blob/main/README.md#limit-the-lookback-window)
  for details. Affects [`fivetran_platform__connection_status`](https://fivetran.github.io/dbt_fivetran_log/#!/model/model.fivetran_log.fivetran_platform__connection_status),
  [`fivetran_platform__schema_changelog`](https://fivetran.github.io/dbt_fivetran_log/#!/model/model.fivetran_log.fivetran_platform__schema_changelog),
  [`fivetran_platform__audit_user_activity`](https://fivetran.github.io/dbt_fivetran_log/#!/model/model.fivetran_log.fivetran_platform__audit_user_activity),
  [`fivetran_platform__connection_daily_events`](https://fivetran.github.io/dbt_fivetran_log/#!/model/model.fivetran_log.fivetran_platform__connection_daily_events),
  [`fivetran_platform__audit_table`](https://fivetran.github.io/dbt_fivetran_log/#!/model/model.fivetran_log.fivetran_platform__audit_table),
  [`fivetran_platform__sync_metrics`](https://fivetran.github.io/dbt_fivetran_log/#!/model/model.fivetran_log.fivetran_platform__sync_metrics),
  [`fivetran_platform__connection_errors_and_warnings`](https://fivetran.github.io/dbt_fivetran_log/#!/model/model.fivetran_log.fivetran_platform__connection_errors_and_warnings),
  and [`fivetran_platform__transformation_run_log`](https://fivetran.github.io/dbt_fivetran_log/#!/model/model.fivetran_log.fivetran_platform__transformation_run_log)
  (**note:** run `dbt run --full-refresh` after setting or changing this variable).
date: '2026-10-29'
