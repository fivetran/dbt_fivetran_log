database_key: fivetran_platform_database
schema_key: fivetran_platform_schema

dbt_versions: ">=1.3.0 <3.0.0"

table_variables:
  fivetran_platform_using_destination_membership:
    - destination_membership
  fivetran_platform_using_user:
    - user
  fivetran_platform_using_connection:
    - connection
  fivetran_platform_using_audit_trail:
    - audit_trail
  fivetran_platform_using_transformations:
    - transformation_runs
  fivetran_platform_using_connector_sdk_log:
    - connector_sdk_log

destination_configurations:
  databricks:
    dispatch:
      - macro_namespace: dbt_utils
        search_order: [ 'spark_utils', 'dbt_utils' ]

public_models: [
  "fivetran_platform__schema_changelog",
  "fivetran_platform__connection_daily_events",
  "fivetran_platform__audit_user_activity",
  "fivetran_platform__connection_status",
  "fivetran_platform__usage_history",
  "fivetran_platform__audit_table",
  "fivetran_platform__audit_trail_enriched",
  "fivetran_platform__mar_table_history",
  "fivetran_platform__transformation_run_log",
  "fivetran_platform__errors_and_warnings",
  "fivetran_platform__sync_metrics",
  "fivetran_platform__connection_event_variance",
  "fivetran_platform__records_modified_variance"
]

supported_vars:
  fivetran_platform_lookback_window_months:
    type: integer
    description: "Number of months of log history to include when building log-based models. When unset, all log history is used. Affects `fivetran_platform__connection_status`, `fivetran_platform__schema_changelog`, `fivetran_platform__audit_user_activity`, `fivetran_platform__connection_daily_events`, and `fivetran_platform__audit_table`."
    display_name: "Log Lookback Window (Months)"
  fivetran_platform_event_high_variance_percent:
    type: float
    description: "Percentage above a connection's average weekday event volume before a day is flagged as `event_variance` in `fivetran_platform__connection_event_variance`. Defaults to 0.2 (20%)."
    display_name: "High Event Variance Percent"
  fivetran_platform_event_low_variance_percent:
    type: float
    description: "Percentage below a connection's average weekday event volume before a day is flagged as `event_variance` in `fivetran_platform__connection_event_variance`. Defaults to 0.2 (20%)."
    display_name: "Low Event Variance Percent"
  fivetran_platform_records_modified_high_variance_percent:
    type: float
    description: "Percentage above the average rows modified (per connection, table, operation type, and weekday) before a record modification event is flagged as `variance` in `fivetran_platform__records_modified_variance`. Defaults to 0.2 (20%)."
    display_name: "High Records Modified Variance Percent"
  fivetran_platform_records_modified_low_variance_percent:
    type: float
    description: "Percentage below the average rows modified (per connection, table, operation type, and weekday) before a record modification event is flagged as `variance` in `fivetran_platform__records_modified_variance`. Defaults to 0.2 (20%)."
    display_name: "Low Records Modified Variance Percent"
