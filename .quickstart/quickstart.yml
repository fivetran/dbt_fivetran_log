database_key: fivetran_platform_database
schema_key: fivetran_platform_schema

dbt_versions: ">=1.3.0 <3.0.0"

table_variables:
  fivetran_platform_using_destination_membership:
    - destination_membership
  fivetran_platform_using_user:
    - user
  fivetran_platform_using_connection:
    - connection
  fivetran_platform_using_audit_trail:
    - audit_trail
  fivetran_platform_using_transformations:
    - transformation_runs
  fivetran_platform_using_connector_sdk_log:
    - connector_sdk_log

destination_configurations:
  databricks:
    dispatch:
      - macro_namespace: dbt_utils
        search_order: [ 'spark_utils', 'dbt_utils' ]

public_models: [
  "fivetran_platform__schema_changelog",
  "fivetran_platform__connection_daily_events",
  "fivetran_platform__audit_user_activity",
  "fivetran_platform__connection_status",
  "fivetran_platform__usage_history",
  "fivetran_platform__audit_table",
  "fivetran_platform__audit_trail_enriched",
  "fivetran_platform__mar_table_history",
  "fivetran_platform__transformation_run_log",
  "fivetran_platform__connection_errors_and_warnings",
  "fivetran_platform__sync_metrics"
]

supported_vars:
  fivetran_platform_log_start_date:
    type: string
    description: "Earliest date (YYYY-MM-DD) of log history to include when building log-based models. When unset, all log history is used. Because it is a fixed date, a full refresh always reloads from this start date and never loses history. Affects all models except fivetran_platform__mar_table_history and fivetran_platform__usage_history."
    display_name: "Log Start Date"
