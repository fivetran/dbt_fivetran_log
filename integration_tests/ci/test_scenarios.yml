# Only set if not using default adapter ranges
# dbt_adapter_versions:
#   snowflake: ">=1.3.0,<2.0.0"
#   bigquery: ">=1.3.0,<2.0.0"
#   postgres: ">=1.3.0,<2.0.0"
#   redshift: ">=1.3.0,<2.0.0"
#   databricks: ">=1.6.0,<2.0.0"

schema_variable_name: "fivetran_platform_schema"

include_databricks_sql: true
include_sqlserver: true
include_dbt_compile: true

test_scenarios:
  - name: "Default"
    vars: {}
    include_incremental: false

  - name: "log json data"
    vars:
      fivetran_platform_log_identifier: "log_json_data"
    include_incremental: false
    warehouses: ["bigquery", "redshift", "postgres"]

  - name: "usage pricing enabled"
    vars:
      fivetran_platform__usage_pricing: true
      fivetran_platform_using_connection: false
    include_incremental: false

  - name: "usage pricing with transformations"
    vars:
      fivetran_platform__credits_pricing: false
      fivetran_platform__usage_pricing: true
      fivetran_platform_using_transformations: true
    include_incremental: false

  - name: "minimal features"
    vars:
      fivetran_platform__usage_pricing: false
      fivetran_platform_using_destination_membership: false
      fivetran_platform_using_user: false
      fivetran_platform_using_transformations: false
      fivetran_platform_using_connector_sdk_log: false
    include_incremental: false

  - name: "audit trail enabled"
    vars:
      fivetran_platform_using_audit_trail: true
    include_incremental: false

  - name: "connector sdk log enabled"
    vars:
      fivetran_platform_using_connector_sdk_log: true
    include_incremental: false

  - name: "audit table with log start date"
    vars:
      # the log seed holds two sync sessions for this_connection, on 2021-12-09 and 2021-12-10.
      # this start date drops the 2021-12-09 session (and the two 2021-02 records) so
      # fivetran_platform__audit_table is still populated but visibly narrowed by the filter.
      # it also materializes stg_fivetran_platform__log as a table instead of a view.
      fivetran_platform_log_start_date: '2021-12-10'
    include_incremental: false