version: 2

models:

  - name: fivetran_platform__connection_status
    description: > 
      Table of connections for each destination, including connection details and sync status.
    columns:
      - name: connection_id
        description: System generated unique ID of the connection.
      - name: connection_name
        description: Name of the connection.
      - name: connector_type
        description: The kind of connector (e.g. Google Sheets, Webhooks).
      - name: destination_id
        description: Foreign key referencing the destination receiving data from the connection.
      - name: destination_name
        description: Name of the destination receiving data from the connection.
      - name: connection_health
        description: >
          Current sync and connection status of the connection. Possible values include 
          `broken`, `deleted`, `incomplete`, `connected`, `paused`, `initial sync in progress`, and `priority first sync`.
      - name: last_successful_sync_completed_at
        description: Timestamp of the most recent successful sync completion.
      - name: last_sync_started_at
        description: >
          Timestamp of the most recent sync initiation. Data arriving after this timestamp is not included in the sync.
      - name: last_sync_completed_at
        description: Timestamp of the most recent sync completion, regardless of success or failure.
      - name: set_up_at
        description: Timestamp when the connection was set up.
      - name: number_of_schema_changes_last_month
        description: > 
          The number of schema changes (creating tables or schemas and altering tables) in the past 30 days.
      - name: number_errors_since_last_completed_sync
        description: The number of errors logged since the last completed sync.
      - name: number_warnings_since_last_completed_sync
        description: The number of warnings logged since the last completed sync.

  - name: fivetran_platform__mar_table_history
    description: >
      Table of monthly active rows (MAR) for each table across connections, destinations, and schemas, per month.
      Read more about MAR definitions and calculations [here](https://fivetran.com/docs/getting-started/consumption-based-pricing).
    columns:
      - name: connection_name
        description: Name of the connection loading the table.
      - name: connection_id
        description: System-generated unique ID of the connection loading the table.
      - name: schema_name
        description: Name of the schema containing the table.
      - name: table_name
        description: Name of the table for which MAR was measured.
      - name: destination_id
        description: Foreign key referencing the destination receiving data from the connection.
      - name: measured_month
        description: Month of the MAR measurement, formatted as YYYY-MM-01.
      - name: last_measured_at
        description: Timestamp when the last MAR measurement for the month was made.
      - name: free_monthly_active_rows
        description: The number of free active rows measured in the table for the month.
      - name: paid_monthly_active_rows
        description: The number of paid active rows measured in the table for the month.
      - name: total_monthly_active_rows
        description: The total number of active rows measured in the table for the month.
      - name: connector_type
        description: The kind of connector (e.g. Google Sheets, Webhooks).
      - name: destination_name 
        description: Name of the destination as it appears in the UI.


  - name: fivetran_platform__usage_history
    description: >
      Table of each destination's usage and active volume per month, including usage per million MAR and MAR per usage. 
      Usage is measured in dollars or credits, depending on the customer's pricing model. 
      Read more about the relationship between usage and MAR [here](https://www.fivetran.com/legal/service-consumption-table).\
    columns:
      - name: measured_month
        description: Month of the usage/MAR measurement, formatted as YYYY-MM-01.
      - name: destination_id
        description: Foreign key referencing the destination receiving data from the connection.
      - name: destination_name
        description: Name of the destination as it appears in the UI.
      - name: free_monthly_active_rows
        description: The number of free active rows measured in the destination for the given month.
      - name: paid_monthly_active_rows
        description: The number of paid active rows measured in the destination for the given month.
      - name: total_monthly_active_rows
        description: The total number of active rows measured in the destination for the given month.
      - name: credits_spent_per_million_mar
        description: The ratio of credits spent per million active rows synced in the given month.
      - name: mar_per_credit_spent
        description: The ratio of the active volume to credits spent in the given month.
      - name: amount_spent_per_million_mar
        description: The ratio of amount spent per million active rows synced in the given month.
      - name: mar_per_amount_spent
        description: The ratio of the active volume to amount spent in the given month.
      - name: credits_spent
        description: The number of credits used by the destination in the given month.
      - name: dollars_spent
        description: The dollar amount used by the destination in the given month.
      - name: paid_model_runs
        description: The number of paid model runs for the destination in the given month.
      - name: free_model_runs
        description: The number of free model runs for the destination in the given month.
      - name: total_model_runs
        description: The total number of model runs for the destination in the given month.

  - name: fivetran_platform__connection_daily_events
    description: >
      Table of each connection's daily history, tracking the number of API calls, schema changes, and records 
      modified since the connection's setup date.
    columns:
      - name: connection_id
        description: System generated unique ID of the connection.
      - name: connection_name
        description: Name of the connection.
      - name: connector_type
        description: The kind of connector (e.g. Google Sheets, Webhooks).
      - name: destination_id
        description: Foreign key referencing the destination receiving data from the connection.
      - name: destination_name
        description: Name of the destination receiving data from the connection.
      - name: date_day
        description: Date when API call metrics were recorded for the connection.
      - name: count_api_calls
        description: The number of API call events recorded for the connection on the given day.
      - name: count_record_modifications
        description: The total number of records modified, including updates, inserts, and deletes.
      - name: count_schema_changes
        description: The number of schema change events for the connection. 

  - name: fivetran_platform__audit_table
    description: >
      Table replacing the deprecated `fivetran_audit` table. Each record represents a table written 
      to during a connection sync, tracking timestamps and row counts. Note: Row counts may differ 
      from the deprecated `fivetran_audit`, which reported pre-duplicate data loads.
    columns:
      - name: unique_table_sync_key
        description: Primary key of the table, hashed on `schema_name`, `connection_id`, `destination_id`, `table_name`, and `unique_table_sync_key`.
        tests:
          - unique
          - not_null
      - name: connection_id
        description: System generated unique ID of the connection.
      - name: connection_name
        description: Name of the connection.
      - name: schema_name
        description: Name of the schema. If not provided, the `connection_name` is used.
      - name: table_name
        description: Name of the table being written to during the sync.  
      - name: destination_id
        description: Foreign key referencing the destination receiving data from the connection.
      - name: destination_name
        description: Name of the destination receiving data from the connection.
      - name: write_to_table_start
        description: Timestamp when Fivetran started writing to the table during a sync.
      - name: write_to_table_end
        description: Timestamp when Fivetran finished writing to the table during a sync.
      - name: sync_start
        description: Timestamp when the connection-level sync began writing or modifying records in the table.
      - name: sync_end
        description: Timestamp when the connection-level sync successfully completed writing or modifying records in the table.
      - name: sum_rows_replaced_or_inserted
        description: Total number of rows replaced or inserted into the table during a sync. 
      - name: sum_rows_updated
        description: Total number of rows updated in the table during a sync.
      - name: sum_rows_deleted
        description: Total number of rows deleted from the table during a sync.
      - name: write_to_table_start_day
        description: The `write_to_table_start` field truncated to the `day`, used for partitioning with the `insert_overwrite` incremental method.

  - name: fivetran_platform__schema_changelog
    description: >
      Table of schema changes for each connection, including table alterations, table creations,
      schema configuration changes, and schema creations.
    columns:
      - name: connection_id
        description: System generated unique ID of the connection.
      - name: connection_name
        description: Name of the connection whose schema was changed. 
      - name: destination_id
        description: Foreign key referencing the destination receiving data from the connection.
      - name: destination_name
        description: Name of the destination receiving data from the connection. 
      - name: created_at
        description: Timestamp when the schema change was written. 
      - name: event_subtype
        description: Type of schema change event. Possible values include 'alter_table', 'create_table', 'change_schema_config', and 'create_schema'.
      - name: message_data
        description: The details of the event in a JSON-like string format.
      - name: table_name
        description: Name of the table if it was altered or created. 
      - name: schema_name
        description: Name of the schema if it was created. 

  - name: fivetran_platform__transformation_run_log
    description: >
      Table of transformation run events from the Fivetran log. Each record represents a single
      transformation execution, including run timestamps, duration, per-step model counts, and outcome.
      Only populated when the `transformation_runs` source table exists.
    columns:
      - name: unique_transformation_run_key
        description: >
          Surrogate key hashed on `log_id`, `transformation_id`, `started_at`, and `ended_at` to uniquely identify
          each transformation run event. The source `log_id` is not unique on its own, as a single log record can
          capture multiple distinct transformation runs.
        tests:
          - unique
          - not_null
      - name: log_id
        description: ID of the log record that captured the transformation run event. Not unique on its own.
      - name: started_at
        description: Timestamp when the transformation run started.
      - name: ended_at
        description: Timestamp when the transformation run ended.
      - name: duration_seconds
        description: Total run duration in seconds.
      - name: duration
        description: Total run duration formatted as HH:MM:SS.
      - name: destination_id
        description: Foreign key referencing the destination associated with the transformation.
      - name: destination_name
        description: Name of the destination associated with the transformation.
      - name: project_type
        description: Type of transformation project (e.g., `DBT_CORE`, `QUICKSTART`). dbt transformations not associated with a connection (cron scheduled) will have an expected null connection_id.
      - name: free_type
        description: Indicates the type of free model run, or `PAID` for paid model runs.
      - name: connection_ids
        description: >
          Comma-separated list of connection IDs scheduled to trigger this transformation. For QUICKSTART
          transformations without a scheduled connection, the single connection parsed from the transformation name.
      - name: connection_names
        description: >
          Comma-separated list of connection names scheduled to trigger this transformation. For QUICKSTART
          transformations without a scheduled connection, the single connection parsed from the transformation name.
      - name: transformation_name
        description: User-defined name of the transformation.
      - name: transformation_id
        description: System-generated unique ID of the transformation job, parsed from the log message.
      - name: transformation_type
        description: The type of transformation (e.g., DBT_CORE, QUICKSTART).
      - name: successful_model_runs
        description: Number of models that ran successfully in this transformation execution.
      - name: failed_model_runs
        description: Number of models that failed in this transformation execution.
      - name: transformation_status
        description: >
          Outcome of the transformation run. Possible values are `transformation_succeeded`,
          `transformation_partially_succeeded`, and `transformation_failed`.
      - name: full_run_log
        description: The raw JSON message data from the log event.

  - name: fivetran_platform__audit_user_activity
    description: >
      Table of user-triggered actions in a Fivetran instance for audit-trail purposes. 
      Helps trace actions to [log events](https://fivetran.com/docs/logs#logeventlist) such as 
      schema changes, sync frequency updates, manual updates, broken connections, etc.
    columns:
      - name: date_day
        description: Date on which the user action occurred.
      - name: day_name
        description: Abbreviated weekday name of the date when this user action occurred (e.g., Mon, Tue, Wed).  
      - name: day_of_month
        description: Day of the month when this user action occurred (e.g. 2022-03-06 --> 6).
      - name: occurred_at
        description: Timestamp when the event was logged.
      - name: destination_name
        description: UI-facing name of the destination where the user action was made.
      - name: destination_id
        description: Foreign key referencing the destination where the user action was made.
      - name: connection_name
        description: Name of the connection with which the user interacted.
      - name: connection_id 
        description: Foreign key referencing the `connection` with which the user interacted.
      - name: email
        description: Account email of the user who triggered the action.
      - name: first_name
        description: Given name of the user who triggered the action.
      - name: last_name
        description: Surname of the user who triggered the action.
      - name: user_id
        description: Foreign key referencing the `user` who triggered the action.
      - name: destination_role
        description: The acting user's permissions for this individual destination.
      - name: event_type 
        description: >
          High-level event category. Possible values include `WARNING`, `ERROR`, and `INFO`,
          with `INFO` being typical for user-triggered actions.
      - name: event_subtype
        description: The routine involved in the log event, defined [here](https://fivetran.com/docs/logs#logevents).
      - name: message_data
        description: The details of the event in a JSON-like string format.
      - name: log_id
        description: Unique ID of the log record.

  - name: fivetran_platform__audit_trail_enriched
    description: >
      Table of user actions performed within your Fivetran account, enriched with the human-readable
      names of the resources involved and the user who performed each action. Each event references a
      primary resource (the container, e.g. an `ACCOUNT`) and an optional secondary resource (the member,
      e.g. a `USER` added to a `TEAM`). This model resolves both resource references to their names when
      the resource type is a `CONNECTION`, `DESTINATION`, `USER`, or `ACCOUNT`. This table is only
      available on the Enterprise plan and above.
    columns:
      - name: unique_audit_trail_key
        description: Surrogate key hashed on `audit_trail_id` and `captured_at` to uniquely identify each audit trail event.
        tests:
          - unique
          - not_null
      - name: audit_trail_id
        description: Identifier of the audit trail event.
      - name: captured_at
        description: Timestamp when the action was performed.
      - name: user_id
        description: Foreign key referencing the `user` who performed the action.
      - name: actor_email
        description: Account email of the user who performed the action. Only available when the `user` source table is enabled.
      - name: actor_first_name
        description: Given name of the user who performed the action. Only available when the `user` source table is enabled.
      - name: actor_last_name
        description: Surname of the user who performed the action. Only available when the `user` source table is enabled.
      - name: action
        description: The type of operation performed. Possible values include `CREATE`, `EDIT`, and `DELETE`.
      - name: interaction_method
        description: How the action was performed. Possible values include `WEB_UI`, `API`, and `SYSTEM`.
      - name: primary_resource_type
        description: >
          The main type of resource (the container) affected by the action (e.g., `ACCOUNT`, `DESTINATION`, `CONNECTION`,
          `TEAM`, `USER`, `TRANSFORMATION`, `ROLE`, `EXTERNAL_LOG_SERVICE`). 'TEAM' resource type is not currently brought in at the connector level, so this resouce type will always be null.
      - name: primary_resource_id
        description: Identifier of the primary resource affected by the action.
      - name: primary_resource_name
        description: >
          Name of the primary resource, resolved from `primary_resource_id` when `primary_resource_type` is a
          `CONNECTION`, `DESTINATION`, `ACCOUNT`, or `USER` (the user's email). Null for resource types without a
          name lookup or when the resource no longer exists.
      - name: secondary_resource_type
        description: The type of secondary resource (the member) affected by the action, if applicable.
      - name: secondary_resource_id
        description: Identifier of the secondary resource affected by the action, if applicable.
      - name: secondary_resource_name
        description: >
          Name of the secondary resource, resolved from `secondary_resource_id` when `secondary_resource_type` is a
          `CONNECTION`, `DESTINATION`, `ACCOUNT`, or `USER` (the user's email). Null for resource types without a
          name lookup or when the resource no longer exists.
      - name: old_values
        description: JSON-like string of the resource's attributes before the action.
      - name: new_values
        description: JSON-like string of the resource's attributes after the action.
      - name: _fivetran_synced
        description: Timestamp when the record was last synced.

  - name: fivetran_platform__connection_errors_and_warnings
    description: >
      Table of connector error and warning events across both standard Fivetran connections (from the `log` table) and
      Connector SDK connections (from the `connector_sdk_log` table).
    columns:
      - name: unique_error_warning_key
        description: Surrogate key hashed on `event_id`, `connection_id`, `sync_id`, and `event_time` to uniquely identify each error or warning event.
        tests:
          - unique
          - not_null
      - name: connection_id
        description: Foreign key referencing the connection that emitted the event.
      - name: connection_name
        description: Name of the connection that emitted the event. May be null if the connection is no longer present in the `connection` table.
      - name: event_time
        description: Timestamp when the event was logged.
      - name: severity_level
        description: >
          Raw severity of the event as reported by the source, passed through without normalization. Both sources
          report `WARNING` and `SEVERE`; `ERROR` is reported only by the `connector_sdk_log` source.
      - name: message
        description: The details of the event. For standard connections this is the JSON-like `message_data` string; for Connector SDK connections this is the plain-text log message.
      - name: is_custom_connector
        description: >
          Boolean indicating which source the event originated from. `false` for standard connections (from the `log`
          table) and `true` for Connector SDK connections (from the `connector_sdk_log` table).
      - name: sync_id
        description: Identifies which sync the event is associated with.

  - name: fivetran_platform__sync_metrics
    description: >
      Table of completed syncs, with one record per `sync_stats` log event. Combines each sync's
      extract, process, and load timing and volume statistics with its total duration and the total
      number of records modified, enriched with connection and destination context.
    columns:
      - name: unique_sync_key
        description: Primary key of the model, hashed on `connection_id`, `sync_id`, and `sync_completed_at`.
        tests:
          - unique
          - not_null
      - name: log_id
        description: ID of the `sync_stats` log record.
      - name: sync_id
        description: System-generated ID of the sync.
      - name: connection_id
        description: System-generated unique ID of the connection that ran the sync.
      - name: connection_name
        description: Name of the connection that ran the sync.
      - name: connector_type
        description: The kind of connector (e.g. Google Sheets, Webhooks).
      - name: destination_id
        description: Foreign key referencing the destination receiving data from the connection.
      - name: destination_name
        description: Name of the destination receiving data from the connection.
      - name: sync_completed_at
        description: Timestamp when the sync completed and the `sync_stats` event was logged.
      - name: date_day
        description: The `sync_completed_at` timestamp truncated to the day.
      - name: day_of_week
        description: Weekday name of `date_day` (e.g. Monday, Tuesday).
      - name: extract_time_s
        description: Time spent extracting data from the source during the sync, in seconds.
      - name: extract_volume_mb
        description: Volume of data extracted from the source during the sync, in megabytes.
      - name: process_time_s
        description: Time spent processing data during the sync, in seconds.
      - name: process_volume_mb
        description: Volume of data processed during the sync, in megabytes.
      - name: load_time_s
        description: Time spent loading data into the destination during the sync, in seconds.
      - name: load_volume_mb
        description: Volume of data loaded into the destination during the sync, in megabytes.
      - name: total_time_s
        description: Total duration of the sync, in seconds.
      - name: rows_modified_count
        description: Total number of records modified during the sync, summed across all `records_modified` events sharing the same `sync_id`.
